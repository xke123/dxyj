<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>地心游记 — 核心玩法复刻</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="game-app">
    <canvas id="game-canvas"></canvas>

    <!-- 顶部 HUD（对应原版状态栏） -->
    <header id="game-hud">
      <!-- 生命力（对应原版 HP/Energy） -->
      <div class="hud-block hp-block">
        <span class="hud-label">⚡ 能量</span>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill" id="hp-fill"></div>
        </div>
        <span class="hud-val" id="hp-text">100/100</span>
      </div>

      <!-- 深度 -->
      <div class="hud-block depth-block">
        <span class="hud-label">📡 深度</span>
        <span class="hud-val accent" id="depth-val">0m</span>
        <span class="hud-sep">/</span>
        <span class="hud-target" id="target-depth-val">120m</span>
      </div>

      <!-- 金币（对应原版 coins） -->
      <div class="hud-block coins-block">
        <span class="hud-label">💰 金币</span>
        <span class="hud-val gold" id="coins-val">0</span>
      </div>
    </header>

    <!-- 通关/失败覆盖层 -->
    <div id="overlay" class="overlay-hidden">
      <div class="overlay-card">
        <h2 id="overlay-title"></h2>
        <div id="overlay-body"></div>
        <button id="btn-restart" class="btn-restart">再次挑战</button>
      </div>
    </div>

    <!-- 虚拟方向键（移动端/触屏） -->
    <div id="touch-controls">
      <div class="dpad">
        <button id="btn-up"    class="dpad-btn dpad-up">▲</button>
        <button id="btn-left"  class="dpad-btn dpad-left">◀</button>
        <button id="btn-dig"   class="dpad-btn dpad-center">⛏</button>
        <button id="btn-right" class="dpad-btn dpad-right">▶</button>
        <button id="btn-down"  class="dpad-btn dpad-down">▼</button>
      </div>
    </div>

    <!-- 键盘提示 -->
    <div id="kb-hint">
      <span class="kb">方向键/WASD</span> 移动 &nbsp;
      <span class="kb">空格/J</span> 挖掘
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
